# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "asutosh-karya"
repo_name: "mt-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True

# file paths
json_readme_path: './docs/mt-arxiv-daily.json'
json_gitpage_path: './docs/mt-arxiv-daily-web.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'

# archive: README.md / index.md only keep the latest papers of each keyword
# (github stops rendering markdown beyond 512 KB), all papers are archived by
# year, one markdown per keyword: <archive_dir>/<year>/<Keyword>.md, shared by
# the README and the gitpage
max_papers_in_readme: 200
archive_dir: './docs/archive'

# code links: PapersWithCode is gone, github repos are looked up from the paper's
# abstract, Hugging Face papers and GitHub code search (needs GITHUB_TOKEN, 10
# requests/min). The weekly update re-checks papers without code published within
# code_check_days (<= 0 for all), at most max_code_checks papers per run, least
# recently checked first; code_checks_path remembers when each paper was checked;
# GitHub searches stop after max_code_search_minutes so the job finishes in time
code_check_days: 180
max_code_checks: 300
max_code_search_minutes: 40
code_checks_path: './docs/code-checks.json'

# keywords to search, optional "categories" limit the arxiv categories (eg. cs.CL)
# of one keyword; a top-level "categories" applies to all keywords
categories: ["cs.CL"]
keywords:
    "Neural MT":
        filters: ["Neural Machine Translation", "NMT"]
    "Multilingual MT":
        filters: ["Multilingual Machine Translation", "Multilingual NMT",
                  "Massively Multilingual Translation"]
    "Low-Resource MT":
        filters: ["Low-Resource Machine Translation", "Low-Resource Translation",
                  "Zero-Shot Translation"]
    "Document-Level MT":
        filters: ["Document-Level Machine Translation", "Document-Level Translation",
                  "Context-Aware Machine Translation"]
    "Speech Translation":
        filters: ["Speech Translation", "Speech-to-Text Translation",
                  "End-to-End Speech Translation"]
        categories: ["cs.CL", "cs.SD", "eess.AS"]
    "Simultaneous Translation":
        filters: ["Simultaneous Translation", "Simultaneous Machine Translation",
                  "Streaming Machine Translation"]
    "LLM Translation":
        filters: ["LLM-based Machine Translation",
                  "Large Language Models for Machine Translation", "LLM Translation"]
    "Evaluation and Quality Estimation":
        filters: ["Machine Translation Evaluation", "Translation Quality Estimation",
                  "Quality Estimation"]
    "Domain Adaptation":
        filters: ["Domain Adaptation for Machine Translation",
                  "Domain Adaptive Machine Translation",
                  "Terminology-Constrained Translation"]
    "Multimodal MT":
        filters: ["Multimodal Machine Translation", "Multimodal Translation",
                  "Visually Grounded Translation"]
